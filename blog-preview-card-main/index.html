<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
        <link rel="stylesheet" href="./styles/index.css">
        
        <title>Frontend Mentor | Blog preview card</title>

        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution { font-size: 0.6875rem; text-align: center; }
            .attribution a { color: hsl(228, 45%, 44%); }
        </style>
    </head>
    <body>

        <div class="container">
            <div class="card">
                <img src="./assets/images/illustration-article.svg" alt="Graphic with empty HTML tag and braces"/>
                <div class="card-info">
                    <span class="category">Learning</span>
                    <h4>Published 21 Dec 2023</h4>
                    <h3>HTML & CSS foundations</h3>
                    <small>These languages are the backbone of every website, defining structure, content, and presentation.</small>
                    <div class="byline">
                        <img src="./assets/images/image-avatar.webp" alt="Image of Greg Hooper"/>
                        <p>Greg Hooper</p>
                    </div>
                </div>
            </div>
        
        </div>
        <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
            Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
